<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic CSS</title>
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
  <section id="card-wrapper" class="section">
    <div class="center">
      <h2 class="title-huge">Cards</h2>
      <div class="card-holder">
        <div class="card">
          <h3>Nome do projeto</h3>
          <p>Muted Text</p>
        </div>
        <div class="card">
          <h3>Teste de tipografia</h3>
          <h4>Subtítulo só pra testar</h4>
          <p>Muted Text</p>
        </div>
        <div class="card">
          <h3>Teste de tipografia</h3>
          <h4>Subtítulo só pra testar</h4>
          <p>Muted Text</p>
        </div>
      </div>
    </div>
  </section>
  <section class="section bg-light">
    <div class="center">
      <h4>Click to change light/dark mode</h4>
      <button onclick="document.querySelector('body').classList.toggle('light')">Toggle</button>
    </div>
  </section>
</body>
</html>
